<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LCMAgent · 四公里混合城区</title>
  <style>
    :root{color-scheme:light;--paper:#f7f6f0;--ink:#203d47;--muted:#5c7378;--line:#d4dbd6;--accent:#c17442}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;overflow:hidden}
    header{height:104px;padding:21px 28px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:20px}
    h1{font-size:23px;letter-spacing:.02em;font-weight:600;margin:0 0 9px}p{margin:0;color:var(--muted);line-height:1.6}
    nav{display:flex;align-items:center;gap:8px;flex-wrap:wrap}button,a{font:inherit;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:5px;padding:9px 12px;text-decoration:none;cursor:pointer}
    button:hover,a:hover{background:#e5ebe2}button[aria-pressed=true]{background:#dce5df}button:focus-visible,a:focus-visible{outline:2px solid var(--accent)}
    main{position:relative;height:calc(100dvh - 174px)}canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}canvas.dragging{cursor:grabbing}
    #north{position:absolute;right:28px;top:24px;font-size:19px;pointer-events:none}#status{position:absolute;top:20px;left:28px;max-width:390px;line-height:1.65;background:#f7f6f0e8;padding:10px 14px;border:1px solid var(--line);border-radius:5px;pointer-events:none}
    #scale{position:absolute;left:28px;bottom:20px;pointer-events:none;color:var(--muted);font-size:12px}#scale-line{height:8px;border:solid var(--ink);border-width:0 2px 2px;width:100px;margin-top:5px}
    footer{height:70px;border-top:1px solid var(--line);padding:12px 28px;display:flex;justify-content:space-between;gap:20px;align-items:center;color:var(--muted);font-size:12px;line-height:1.7}.legend{display:flex;gap:16px;flex-wrap:wrap}.legend span{white-space:nowrap}.legend i{display:inline-block;width:11px;height:11px;margin-right:5px;vertical-align:-1px}
    @media(max-width:760px){header{height:144px;padding:14px;display:block}h1{font-size:20px}header p{font-size:12px}nav{margin-top:10px}button,a{padding:6px 9px}main{height:calc(100dvh - 224px)}footer{height:80px;padding:9px 14px;display:block;font-size:10px}.legend{gap:8px}#status{max-width:260px;left:14px;top:14px;font-size:12px}}
  </style>
</head>
<body>
  <header>
    <div><h1>LCMAgent · 四公里混合城区</h1><p id="subtitle">正在载入统一坐标下的建筑、道路与绿地…</p></div>
    <nav aria-label="地图控制"><button id="fit">全城</button><button id="zoom-in" aria-label="放大">＋</button><button id="zoom-out" aria-label="缩小">－</button><button id="labels" aria-pressed="true">地名</button><a href="city-topview.png" target="_blank">高清俯视图 ↗</a></nav>
  </header>
  <main><canvas id="map" aria-label="4×4公里几何拼接城区，可拖动、缩放和点选建筑" tabindex="0"></canvas><div id="north">N ↑</div><div id="status">滚轮缩放 · 拖动平移 · 点击建筑查看来源</div><div id="scale"><span id="scale-label">1 km</span><div id="scale-line"></div></div></main>
  <footer><div class="legend"><span><i style="background:#adb9bd"></i>&lt;12 m</span><span><i style="background:#90a6ad"></i>12–25 m</span><span><i style="background:#698891"></i>25–60 m</span><span><i style="background:#3f626e"></i>60–120 m</span><span><i style="background:#244b5b"></i>≥120 m</span><span><i style="background:#c3d5b8"></i>绿地</span></div><div>源建筑保持尺寸；街坊重组，道路与绿地为新增设计。<br>预览几何拼接原型 · 非真实城市复原 · 尚未重算信道</div></footer>
  <script>
    const canvas=document.querySelector('#map'), context=canvas.getContext('2d'), status=document.querySelector('#status');
    const citySize=4000, raster=new Image(), buckets=new Map();let city=null, scale=1, centerX=2000, centerY=2000, width=0, height=0, showLabels=true, selected=null, drag=null, drawPending=false;
    raster.src='city-topview-clean.png?layout=compact4';raster.onload=requestDraw;
    function requestDraw(){if(!drawPending){drawPending=true;requestAnimationFrame(()=>{drawPending=false;draw();});}}
    function fit(){scale=Math.min(width-70,height-48)/citySize;centerX=citySize/2;centerY=citySize/2;selected=null;status.textContent='滚轮缩放 · 拖动平移 · 点击建筑查看来源';requestDraw();}
    function resize(){const bounds=canvas.getBoundingClientRect();width=bounds.width;height=bounds.height;canvas.width=Math.round(width*devicePixelRatio);canvas.height=Math.round(height*devicePixelRatio);fit();}
    new ResizeObserver(resize).observe(canvas);
    function world(screenX,screenY){return [centerX+(screenX-width/2)/scale,centerY-(screenY-height/2)/scale];}
    function screen(east,north){return [width/2+(east-centerX)*scale,height/2-(north-centerY)*scale];}
    function trace(points){points.forEach((point,index)=>{const projected=screen(...point);index?context.lineTo(...projected):context.moveTo(...projected);});context.closePath();}
    function visibleBuildings(){const [left,top]=world(0,0),[right,bottom]=world(width,height);const result=new Set();for(let column=Math.floor(left/200);column<=Math.floor(right/200);column++)for(let row=Math.floor(bottom/200);row<=Math.floor(top/200);row++)for(const index of buckets.get(`${column},${row}`)||[])result.add(index);return result;}
    function buildingColor(elevation){return elevation<12?'#adb9bd':elevation<25?'#90a6ad':elevation<60?'#698891':elevation<120?'#3f626e':'#244b5b';}
    function draw(){
      context.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);context.fillStyle='#f7f6f0';context.fillRect(0,0,width,height);
      const [left,top]=screen(0,citySize);if(raster.complete&&raster.naturalWidth)context.drawImage(raster,left,top,citySize*scale,citySize*scale);
      context.strokeStyle='#b5c4bd';context.lineWidth=1;context.strokeRect(left,top,citySize*scale,citySize*scale);
      if(city&&scale>.85){for(const index of visibleBuildings()){const building=city.buildings[index];context.beginPath();trace(building.points);for(const hole of building.holes)trace(hole);context.fillStyle=buildingColor(building.height);context.fill('evenodd');context.strokeStyle='#607b83';context.lineWidth=.65;context.stroke();}}
      if(city&&showLabels){context.font='500 12px -apple-system,"PingFang SC",sans-serif';context.textAlign='center';context.textBaseline='middle';for(const [east,north,label] of city.labels){const [horizontal,vertical]=screen(east,north);if(horizontal<0||horizontal>width||vertical<0||vertical>height)continue;const textWidth=context.measureText(label).width;context.fillStyle='#f7f6f0e8';context.fillRect(horizontal-textWidth/2-7,vertical-12,textWidth+14,24);context.fillStyle='#294750';context.fillText(label,horizontal,vertical);}}
      if(selected!==null&&city){const building=city.buildings[selected];context.beginPath();trace(building.points);for(const hole of building.holes)trace(hole);context.fillStyle='#d9a37477';context.fill('evenodd');context.strokeStyle='#ad592d';context.lineWidth=2;context.stroke();}
      const desired=120/scale;const distance=[10,20,50,100,200,500,1000,2000,5000].reduce((best,item)=>Math.abs(item-desired)<Math.abs(best-desired)?item:best,1000);document.querySelector('#scale-line').style.width=`${distance*scale}px`;document.querySelector('#scale-label').textContent=distance>=1000?`${distance/1000} km`:`${distance} m`;
    }
    function zoom(factor,screenX=width/2,screenY=height/2){const before=world(screenX,screenY);scale=Math.max(Math.min(width,height)/(citySize*1.6),Math.min(12,scale*factor));const after=world(screenX,screenY);centerX+=before[0]-after[0];centerY+=before[1]-after[1];requestDraw();}
    canvas.addEventListener('wheel',event=>{event.preventDefault();const bounds=canvas.getBoundingClientRect();zoom(Math.exp(-event.deltaY*.0015),event.clientX-bounds.left,event.clientY-bounds.top);},{passive:false});
    canvas.addEventListener('pointerdown',event=>{canvas.setPointerCapture(event.pointerId);drag={x:event.clientX,y:event.clientY,startX:event.clientX,startY:event.clientY};canvas.classList.add('dragging');});
    canvas.addEventListener('pointermove',event=>{if(!drag)return;centerX-=(event.clientX-drag.x)/scale;centerY+=(event.clientY-drag.y)/scale;drag.x=event.clientX;drag.y=event.clientY;requestDraw();});
    function contains(points,east,north){let inside=false;for(let current=0,previous=points.length-1;current<points.length;previous=current++){const first=points[current],second=points[previous];if((first[1]>north)!=(second[1]>north)&&east<(second[0]-first[0])*(north-first[1])/(second[1]-first[1])+first[0])inside=!inside;}return inside;}
    canvas.addEventListener('pointerup',event=>{if(drag&&Math.hypot(event.clientX-drag.startX,event.clientY-drag.startY)<5&&city){const bounds=canvas.getBoundingClientRect(),[east,north]=world(event.clientX-bounds.left,event.clientY-bounds.top);selected=null;for(const index of buckets.get(`${Math.floor(east/200)},${Math.floor(north/200)}`)||[]){const building=city.buildings[index];if(contains(building.points,east,north)&&!building.holes.some(hole=>contains(hole,east,north))){selected=index;status.textContent=`${building.source}\n源对象 ${building.object} · 高度 ${building.height} m\n坐标 ${east.toFixed(0)}, ${north.toFixed(0)} m`;break;}}if(selected===null)status.textContent='滚轮缩放 · 拖动平移 · 点击建筑查看来源';requestDraw();}drag=null;canvas.classList.remove('dragging');});
    canvas.addEventListener('pointercancel',()=>{drag=null;canvas.classList.remove('dragging');});
    document.querySelector('#fit').onclick=fit;document.querySelector('#zoom-in').onclick=()=>zoom(1.8);document.querySelector('#zoom-out').onclick=()=>zoom(1/1.8);document.querySelector('#labels').onclick=event=>{showLabels=!showLabels;event.currentTarget.setAttribute('aria-pressed',String(showLabels));requestDraw();};
    canvas.addEventListener('keydown',event=>{if(event.key==='+'||event.key==='=')zoom(1.4);if(event.key==='-')zoom(1/1.4);if(event.key==='0')fit();const movement=100/scale;if(event.key==='ArrowLeft')centerX-=movement;if(event.key==='ArrowRight')centerX+=movement;if(event.key==='ArrowUp')centerY+=movement;if(event.key==='ArrowDown')centerY-=movement;if(event.key.startsWith('Arrow'))event.preventDefault();requestDraw();});
    fetch('assembled-city.view.json?layout=compact4',{cache:'no-store'}).then(response=>{if(!response.ok)throw Error(`HTTP ${response.status}`);return response.json();}).then(data=>{city=data;city.buildings.forEach((building,index)=>{const east=building.points.map(point=>point[0]),north=building.points.map(point=>point[1]);for(let column=Math.floor(Math.min(...east)/200);column<=Math.floor(Math.max(...east)/200);column++)for(let row=Math.floor(Math.min(...north)/200);row<=Math.floor(Math.max(...north)/200);row++){const key=`${column},${row}`;if(!buckets.has(key))buckets.set(key,[]);buckets.get(key).push(index);}});document.querySelector('#subtitle').textContent=`4 × 4 km · ${Object.keys(city.manifest.source_usage).length} 组来源 · ${city.buildings.length.toLocaleString()} 个建筑实例 · 可点选追溯`;requestDraw();}).catch(error=>{status.textContent=`几何载入失败：${error.message}。请通过本地 HTTP 服务打开。`;});
    status.style.whiteSpace='pre-line';
  </script>
</body>
</html>
