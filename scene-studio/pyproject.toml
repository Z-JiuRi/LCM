[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lcm-scene-studio"
version = "0.1.0"
description = "Local geometry tooling and small scene-composition verification"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.11", "shapely>=2.0", "pillow>=10"]

[project.optional-dependencies]
# Reproduce the verified RT stack in a separate Python 3.11 environment.
# Never impose Sionna on the geometry-only environment (including Python 3.14).
rt = ["sionna-rt==2.2.0; python_version == '3.11'"]

[tool.setuptools.packages.find]
where = ["python"]
include = ["lcm_scene*"]

[tool.setuptools.package-data]
lcm_scene = ["migration-baseline.json"]

[tool.lcm-scene.rt]
python = "3.11"
sionna-rt = "2.2.0"
backend = "metal_ad_mono_polarized"
scope = "Optional small functional verification, not full-city RT validation"
